name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pyyaml
      - name: Unit tests (diffing, security prescan, bench matching, config -- no API calls)
        run: PYTHONPATH=src pytest tests/ -v
